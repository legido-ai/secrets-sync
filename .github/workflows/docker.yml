name: Build and publish secrets-sync

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dockerimagetag:
        description: Extra tag to apply
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Date tag
        id: date
        run: echo "date=$(date -u +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"
      - name: Build and push (arm64 + amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.date.outputs.date }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
      - name: Digest
        run: |
          echo "pinned by digest:" > digest.txt
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE }}:latest" | head -5 || true
